<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}
#loading-screen {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: #0a0a0a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 1000;
  transition: opacity 0.8s ease;
}
#loading-screen.fade-out { opacity: 0; pointer-events: none; }
#loading-text {
  font-size: 24px; color: #00ff88;
  letter-spacing: 8px;
  animation: glitch 0.3s infinite;
}
@keyframes glitch {
  0%   { transform: translate(0);       text-shadow: 2px 0 #ff0040, -2px 0 #00ff88; }
  25%  { transform: translate(-2px,1px); text-shadow:-2px 0 #ff0040,  2px 0 #00ff88; }
  50%  { transform: translate(1px,-1px); text-shadow: 1px 0 #ff0040, -1px 0 #00ff88; }
  75%  { transform: translate(-1px,2px); text-shadow:-1px 0 #ff0040,  1px 0 #00ff88; }
  100% { transform: translate(0);       text-shadow: 2px 0 #ff0040, -2px 0 #00ff88; }
}
#loading-bar {
  width: 300px; height: 2px;
  background: #1a1a1a;
  margin-top: 30px;
  position: relative; overflow: hidden;
}
#loading-bar::after {
  content: ''; position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: #00ff88;
  animation: load-sweep 1.5s ease-in-out infinite;
}
@keyframes load-sweep { 0% { left:-100%; } 100% { left:100%; } }
canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
#pseudonym-display {
  position: fixed; top: 20px; right: 20px;
  text-align: right; font-size: 11px;
  opacity: 0.4; line-height: 1.6;
  z-index: 10; pointer-events: none;
  transition: opacity 0.3s;
}
#pseudonym-display:hover { opacity: 0.8; }
#set-label { font-size: 9px; opacity: 0.5; margin-bottom: 6px; letter-spacing: 4px; text-transform: uppercase; }
#timeline-container {
  position: fixed; bottom: 0; left: 0;
  width: 100%; height: 60px;
  background: linear-gradient(transparent, rgba(10,10,10,0.95));
  z-index: 10; padding: 10px 40px;
}
#timeline-track {
  width: 100%; height: 4px;
  background: #1a1a1a;
  position: relative; cursor: pointer;
  margin-top: 15px; border-radius: 2px;
}
#timeline-progress {
  height: 100%; background: #00ff88;
  border-radius: 2px; width: 0%;
  transition: width 0.1s linear;
  box-shadow: 0 0 8px #00ff8855;
}
#timeline-playhead {
  position: absolute; top: -6px;
  width: 16px; height: 16px;
  background: #00ff88; border-radius: 50%;
  transform: translateX(-50%); cursor: grab;
  box-shadow: 0 0 12px #00ff88aa; left: 0%;
}
#timeline-date { font-size: 11px; text-align: center; margin-top: 10px; opacity: 0.6; letter-spacing: 3px; }
#event-markers { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.event-marker { position: absolute; top: -3px; width: 3px; height: 10px; border-radius: 1px; pointer-events: all; cursor: pointer; }
.event-marker.conflict { background: #ff0040; }
.event-marker.repair { background: #00aaff; }
.event-marker.admission { background: #ffffff; }
.event-marker.neutral { background: #00ff8844; }
#tooltip {
  position: fixed; background: #111;
  border: 1px solid #00ff8844;
  padding: 8px 12px; font-size: 10px;
  color: #00ff88; pointer-events: none;
  z-index: 100; display: none;
  max-width: 250px; line-height: 1.5; letter-spacing: 1px;
}
#controls-hint {
  position: fixed; bottom: 70px; left: 40px;
  font-size: 9px; opacity: 0.25;
  letter-spacing: 2px; z-index: 10;
}
#status-display {
  position: fixed; top: 20px; left: 20px;
  font-size: 10px; opacity: 0.3;
  z-index: 10; letter-spacing: 2px;
}
#mode-display {
  position: fixed; top: 36px; left: 20px;
  font-size: 9px; opacity: 0.2;
  z-index: 10; letter-spacing: 3px;
}
#record-btn, #screenshot-btn {
  position: fixed; top: 20px; z-index: 20;
  background: none; border: 1px solid #00ff8844;
  color: #00ff88; font-family: 'Courier New', monospace;
  font-size: 9px; padding: 4px 10px;
  cursor: pointer; letter-spacing: 2px;
  opacity: 0.4; transition: opacity 0.3s;
}
#record-btn:hover, #screenshot-btn:hover { opacity: 0.9; }
#record-btn { left: 50%; transform: translateX(-60px); }
#screenshot-btn { left: 50%; transform: translateX(20px); }
#record-btn.recording { border-color: #ff0040; color: #ff0040; opacity: 0.9; }
#flash-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: white; opacity: 0;
  pointer-events: none; z-index: 50;
  transition: opacity 0.05s;
}

{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ════════════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════════════

const PSEUDONYM_SETS = [
  { name:'MYTHIC', Role1:'Orpheus', Role2:'Eurydice', Role3:'The Thorn', Role4:'The Fury', Role5:'The Ghost', Location:'The Crossroads' },
  { name:'ARCHIVAL', Role1:'The Archivist', Role2:'The Echo', Role3:'The Shadow', Role4:'The Spark', Role5:'The Pattern', Location:'Point Zero' },
  { name:'COSMIC', Role1:'The Weaver', Role2:'The Muse', Role3:'Mars', Role4:'The Witness', Role5:'Pan', Location:'The Stage' }
];
const ROLE_IDS = ['Role1','Role2','Role3','Role4','Role5'];

const VISUAL_MODES = [
  { name:'FLOW',             flow:true,  organism:false, aurora:false },
  { name:'ORGANISM',         flow:false, organism:true,  aurora:false },
  { name:'AURORA',           flow:false, organism:false, aurora:true  },
  { name:'FLOW + ORGANISM',  flow:true,  organism:true,  aurora:false },
  { name:'FLOW + AURORA',    flow:true,  organism:false, aurora:true  },
  { name:'ORGANISM + AURORA',flow:false, organism:true,  aurora:true  },
  { name:'CONVERGENCE',      flow:true,  organism:true,  aurora:true  }
];

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════

let currentSet = PSEUDONYM_SETS[Math.floor(Math.random()*PSEUDONYM_SETS.length)];
let emailData = [];
let playing = false;
let playProgress = 0;
let playSpeed = 0.0002;
let audioStarted = false;
let audioInitialized = false;
let musicEngine = null;
let shakeAmount = 0;
let desaturation = 0;
let flashOpacity = 0;
let freezeFrameUntil = 0;
let prevEventIndex = -1;
let visualModeIndex = Math.floor(Math.random()*VISUAL_MODES.length);
let currentDamage = 0;
let fftAnalyzer = null;

// ════════════════════════════════════════════════════════════════
// JS NOISE (for CPU particle curl noise)
// ════════════════════════════════════════════════════════════════

function hashN(n) { return ((Math.sin(n)*43758.5453123)%1+1)%1; }
function noise3(x,y,z) {
  const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z);
  const fx=x-ix, fy=y-iy, fz=z-iz;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy), uz=fz*fz*(3-2*fz);
  const n=ix*1.0+iy*157.0+iz*113.0;
  const a=hashN(n),b=hashN(n+1),c=hashN(n+157),d=hashN(n+158);
  const e=hashN(n+113),f=hashN(n+114),g=hashN(n+270),h=hashN(n+271);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy+(e-a)*uz+(a-b-e+f)*ux*uz+(a-c-e+g)*uy*uz+(-a+b+c-d+e-f-g+h)*ux*uy*uz;
}
function curlNoise3D(x,y,z,t) {
  const e=0.01, s=0.8;
  const px=x*s,py=y*s,pz=z*s+t;
  const dx=noise3(px+e,py,pz)-noise3(px-e,py,pz);
  const dy=noise3(px,py+e,pz)-noise3(px,py-e,pz);
  const dz=noise3(px,py,pz+e)-noise3(px,py,pz-e);
  return { x:(dy-dz)/(2*e), y:(dz-dx)/(2*e), z:(dx-dy)/(2*e) };
}

// ════════════════════════════════════════════════════════════════
// GLSL SHARED NOISE
// ════════════════════════════════════════════════════════════════

const GLSL_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}

float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.0,i1.z,i2.z,1.0))
    +i.y+vec4(0.0,i1.y,i2.y,1.0))
    +i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float fbm(vec3 p){
  float f=0.0,a=0.5;
  for(int i=0;i<5;i++){f+=a*snoise(p);p*=2.0;a*=0.5;}
  return f;
}
`;

// ════════════════════════════════════════════════════════════════
// ORGANISM SHADER (ray-marched SDFs)
// ════════════════════════════════════════════════════════════════

const ORGANISM_FRAG = GLSL_NOISE + `
precision highp float;
uniform float u_time;
uniform float u_damage;
uniform float u_conflict;
uniform float u_repair;
uniform float u_bass;
uniform float u_mids;
uniform vec2 u_resolution;

float sdSphere(vec3 p,float r){return length(p)-r;}

float scene(vec3 p){
  float sep=mix(0.6,3.0,u_conflict);
  if(u_repair>0.3) sep=mix(sep,0.3,u_repair);
  float t=u_time*0.3;
  vec3 p1=p-vec3(-sep,sin(t)*0.6,cos(t*0.7)*0.4);
  vec3 p2=p-vec3(sep,cos(t*0.8)*0.6,sin(t*0.6)*0.4);
  float ns=0.3+u_damage*2.5;
  float n1=snoise(p1*ns+t*0.3)*u_damage*0.6;
  float n2=snoise(p2*ns+t*0.25)*u_damage*0.6;
  float d1=sdSphere(p1,1.0+u_bass*0.4)+n1;
  float d2=sdSphere(p2,0.85+u_mids*0.35)+n2;
  float k=mix(1.0,0.15,u_damage);
  float h=clamp(0.5+0.5*(d2-d1)/k,0.0,1.0);
  float d=mix(d2,d1,h)-k*h*(1.0-h);
  if(u_damage>0.5){
    float spike=snoise(p*4.0+u_time*0.5)*0.3*(u_damage-0.5);
    d+=spike;
  }
  return d;
}

vec3 calcN(vec3 p){
  vec2 e=vec2(0.002,0.0);
  return normalize(vec3(scene(p+e.xyy)-scene(p-e.xyy),scene(p+e.yxy)-scene(p-e.yxy),scene(p+e.yyx)-scene(p-e.yyx)));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  vec3 ro=vec3(0.0,0.0,4.5);
  vec3 rd=normalize(vec3(uv,-1.5));
  float t=0.0;
  for(int i=0;i<64;i++){
    float d=scene(ro+rd*t);
    if(d<0.002||t>20.0) break;
    t+=d;
  }
  vec3 col=vec3(0.0);
  if(t<20.0){
    vec3 p=ro+rd*t;
    vec3 n=calcN(p);
    float rim=1.0-max(0.0,dot(n,-rd));
    rim=pow(rim,2.5);
    vec3 peaceful=vec3(0.05,0.3,0.7);
    vec3 damaged=vec3(0.7,0.05,0.15);
    vec3 base=mix(peaceful,damaged,u_damage);
    col=base*rim*2.5;
    col+=base*0.08;
    col+=vec3(0.0,0.9,0.5)*pow(rim,6.0)*0.4*(1.0-u_damage);
    col+=vec3(0.9,0.2,0.1)*pow(rim,4.0)*0.5*u_damage;
  }
  gl_FragColor=vec4(col,1.0);
}
`;

// ════════════════════════════════════════════════════════════════
// AURORA SHADER (fractal noise curtains)
// ════════════════════════════════════════════════════════════════

const AURORA_FRAG = GLSL_NOISE + `
precision highp float;
uniform float u_time;
uniform float u_damage;
uniform float u_conflict;
uniform float u_repair;
uniform float u_bass;
uniform float u_highs;
uniform vec2 u_resolution;

float hashN(float n){return fract(sin(n)*43758.5453123);}

vec3 palette(float t,float dmg){
  vec3 a=mix(vec3(0.0,0.15,0.3),vec3(0.3,0.05,0.05),dmg);
  vec3 b=mix(vec3(0.0,0.5,0.3),vec3(0.5,0.1,0.0),dmg);
  vec3 c=mix(vec3(0.1,0.4,0.8),vec3(0.8,0.2,0.1),dmg);
  vec3 d=mix(vec3(0.0,0.3,0.5),vec3(0.6,0.0,0.2),dmg);
  return a+b*cos(6.28318*(c*t+d));
}

void main(){
  vec2 uv=gl_FragCoord.xy/u_resolution;
  vec2 p=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
  float t=u_time*0.15;
  float turb=0.5+u_damage*2.0;
  float n1=fbm(vec3(p.x*1.5,p.y*0.8+t,t*0.3)*turb);
  float n2=fbm(vec3(p.x*2.0+3.0,p.y*1.2+t*0.7,t*0.4+5.0)*turb);
  float n3=fbm(vec3(p.x*0.8+7.0,p.y*2.0+t*0.5,t*0.2+10.0)*turb);
  float curtain=0.0;
  curtain+=smoothstep(0.0,0.6,n1+0.3)*0.5;
  curtain+=smoothstep(0.1,0.7,n2+0.2)*0.35;
  curtain+=smoothstep(0.2,0.8,n3+0.1)*0.25;
  curtain*=smoothstep(0.0,0.3,uv.y)*smoothstep(1.0,0.5,uv.y);
  curtain+=u_bass*0.2;
  vec3 col=palette(curtain*0.5+n1*0.3,u_damage)*curtain;
  col+=vec3(0.0,0.8,0.4)*u_highs*0.1*curtain;
  if(u_conflict>0.3){
    float glitch=step(0.97,hashN(floor(uv.y*40.0+u_time*10.0)));
    col=mix(col,vec3(0.8,0.0,0.2),glitch*u_conflict*0.6);
  }
  if(u_repair>0.3){
    col+=vec3(0.1,0.3,0.6)*u_repair*0.15*curtain;
  }
  gl_FragColor=vec4(col,1.0);
}
`;

// ════════════════════════════════════════════════════════════════
// FLOW PARTICLE SHADERS
// ════════════════════════════════════════════════════════════════

const FLOW_VERT = `
attribute float aRole;
attribute float aLife;
uniform float u_damage;
uniform float u_time;
varying float vRole;
varying float vLife;
varying float vDamage;
void main(){
  vRole=aRole;
  vLife=aLife;
  vDamage=u_damage;
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  float sz=mix(3.0,6.0,u_damage)*aLife;
  gl_PointSize=sz*(300.0/-mv.z);
  gl_Position=projectionMatrix*mv;
}
`;

const FLOW_FRAG = `
precision highp float;
varying float vRole;
varying float vLife;
varying float vDamage;
void main(){
  float d=length(gl_PointCoord-0.5)*2.0;
  if(d>1.0) discard;
  float alpha=smoothstep(1.0,0.3,d)*vLife*0.7;
  vec3 c1=mix(vec3(0.1,0.4,0.9),vec3(0.9,0.3,0.1),vDamage);
  vec3 c2=mix(vec3(0.9,0.6,0.1),vec3(0.4,0.0,0.1),vDamage);
  vec3 col=mix(c1,c2,vRole);
  col+=vec3(0.2,0.8,0.4)*0.15*(1.0-vDamage);
  gl_FragColor=vec4(col*1.5,alpha);
}
`;

// ════════════════════════════════════════════════════════════════
// POST-PROCESSING: COMPOSITE SHADER (vignette, chromatic aberration, grain)
// ════════════════════════════════════════════════════════════════

const COMPOSITE_SHADER = {
  uniforms: {
    tDiffuse: { value: null },
    u_damage: { value: 0 },
    u_time: { value: 0 },
    u_shake: { value: 0 },
    u_flash: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float u_damage;
    uniform float u_time;
    uniform float u_shake;
    uniform float u_flash;
    varying vec2 vUv;
    float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
    void main(){
      vec2 uv=vUv;
      uv+=(vec2(rand(uv+u_time),rand(uv+u_time+1.0))-0.5)*u_shake*0.01;
      float ca=u_damage*0.004+u_shake*0.002;
      vec3 col;
      col.r=texture2D(tDiffuse,uv+vec2(ca,0.0)).r;
      col.g=texture2D(tDiffuse,uv).g;
      col.b=texture2D(tDiffuse,uv-vec2(ca,0.0)).b;
      float vig=1.0-dot((uv-0.5)*1.2,(uv-0.5)*1.2);
      vig=smoothstep(0.0,1.0,vig);
      col*=mix(0.6,1.0,vig);
      float grain=rand(uv+fract(u_time))*0.06;
      col+=grain-0.03;
      col=mix(col,vec3(1.0),u_flash);
      gl_FragColor=vec4(col,1.0);
    }
  `
};

// ════════════════════════════════════════════════════════════════
// VISUAL ENGINE
// ════════════════════════════════════════════════════════════════

const PARTICLE_COUNT = 2000;

class VisualEngine {
  constructor(canvas) {
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setClearColor(0x0a0a0a);
    this.renderer.autoClear = false;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    this.camera.position.z = 5;

    this.uniforms = {
      u_time: { value: 0 },
      u_damage: { value: 0 },
      u_conflict: { value: 0 },
      u_repair: { value: 0 },
      u_bass: { value: 0 },
      u_mids: { value: 0 },
      u_highs: { value: 0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    this.setupOrganism();
    this.setupAurora();
    this.setupFlow();
    this.setupPostProcessing();

    window.addEventListener('resize', () => this.onResize());
  }

  setupOrganism() {
    const geo = new THREE.PlaneGeometry(2, 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: `void main(){gl_Position=vec4(position.xy,0.0,1.0);}`,
      fragmentShader: ORGANISM_FRAG,
      depthTest: false, depthWrite: false, transparent: true,
      blending: THREE.AdditiveBlending
    });
    this.organismMesh = new THREE.Mesh(geo, mat);
    this.organismMesh.frustumCulled = false;
    this.organismMesh.renderOrder = 0;
    this.scene.add(this.organismMesh);
  }

  setupAurora() {
    const geo = new THREE.PlaneGeometry(2, 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: `void main(){gl_Position=vec4(position.xy,0.0,1.0);}`,
      fragmentShader: AURORA_FRAG,
      depthTest: false, depthWrite: false, transparent: true,
      blending: THREE.AdditiveBlending
    });
    this.auroraMesh = new THREE.Mesh(geo, mat);
    this.auroraMesh.frustumCulled = false;
    this.auroraMesh.renderOrder = 1;
    this.scene.add(this.auroraMesh);
  }

  setupFlow() {
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const roles = new Float32Array(PARTICLE_COUNT);
    const lives = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      positions[i*3]   = (Math.random()-0.5)*6;
      positions[i*3+1] = (Math.random()-0.5)*4;
      positions[i*3+2] = (Math.random()-0.5)*3;
      roles[i] = i < PARTICLE_COUNT/2 ? 0 : 1;
      lives[i] = Math.random();
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aRole', new THREE.BufferAttribute(roles, 1));
    geo.setAttribute('aLife', new THREE.BufferAttribute(lives, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: { ...this.uniforms },
      vertexShader: FLOW_VERT,
      fragmentShader: FLOW_FRAG,
      transparent: true,
      depthTest: false, depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    this.flowPoints = new THREE.Points(geo, mat);
    this.flowPoints.renderOrder = 2;
    this.scene.add(this.flowPoints);
    this.flowPositions = positions;
    this.flowRoles = roles;
    this.flowLives = lives;
  }

  setupPostProcessing() {
    this.composer = new EffectComposer(this.renderer);
    this.composer.addPass(new RenderPass(this.scene, this.camera));

    this.bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.2, 0.4, 0.85
    );
    this.composer.addPass(this.bloomPass);

    this.compositePass = new ShaderPass(COMPOSITE_SHADER);
    this.composer.addPass(this.compositePass);
  }

  applyMode(mode) {
    this.organismMesh.visible = mode.organism;
    this.auroraMesh.visible = mode.aurora;
    this.flowPoints.visible = mode.flow;
  }

  updateParticles(dt, damage, conflict) {
    const pos = this.flowPositions;
    const lives = this.flowLives;
    const roles = this.flowRoles;
    const time = this.uniforms.u_time.value;
    const speed = 0.5 + damage * 1.5;
    const chaos = damage * 2;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      let x = pos[i*3], y = pos[i*3+1], z = pos[i*3+2];
      const role = roles[i];

      const attractX = role < 0.5 ? -1.2 : 1.2;
      const attractY = role < 0.5 ? Math.sin(time*0.3)*0.5 : Math.cos(time*0.4)*0.5;

      const curl = curlNoise3D(x+chaos, y+chaos, z, time*0.15);
      const toAttrX = (attractX - x) * 0.01;
      const toAttrY = (attractY - y) * 0.01;

      if (conflict > 0.3) {
        const push = role < 0.5 ? -1 : 1;
        pos[i*3]   += curl.x*dt*speed + push*conflict*dt*0.5;
        pos[i*3+1] += curl.y*dt*speed + (Math.random()-0.5)*conflict*dt;
      } else {
        pos[i*3]   += curl.x*dt*speed + toAttrX;
        pos[i*3+1] += curl.y*dt*speed + toAttrY;
      }
      pos[i*3+2] += curl.z*dt*speed*0.3;

      lives[i] -= dt * (0.1 + damage*0.2);
      if (lives[i] <= 0 || Math.abs(pos[i*3])>5 || Math.abs(pos[i*3+1])>4) {
        const angle = Math.random()*Math.PI*2;
        const r = 0.5 + Math.random()*0.5;
        pos[i*3]   = (role<0.5?-1.2:1.2) + Math.cos(angle)*r;
        pos[i*3+1] = Math.sin(angle)*r;
        pos[i*3+2] = (Math.random()-0.5)*2;
        lives[i] = 0.5 + Math.random()*0.5;
      }
    }

    this.flowPoints.geometry.attributes.position.needsUpdate = true;
    this.flowPoints.geometry.attributes.aLife.needsUpdate = true;
  }

  update(time, dt, damage, conflict, repair, bass, mids, highs, shake, flash) {
    this.uniforms.u_time.value = time;
    this.uniforms.u_damage.value = damage;
    this.uniforms.u_conflict.value = conflict;
    this.uniforms.u_repair.value = repair;
    this.uniforms.u_bass.value = bass;
    this.uniforms.u_mids.value = mids;
    this.uniforms.u_highs.value = highs;

    this.flowPoints.material.uniforms.u_damage.value = damage;
    this.flowPoints.material.uniforms.u_time.value = time;

    this.bloomPass.strength = 1.0 + damage * 0.8 + bass * 0.5;
    this.compositePass.uniforms.u_damage.value = damage;
    this.compositePass.uniforms.u_time.value = time;
    this.compositePass.uniforms.u_shake.value = shake;
    this.compositePass.uniforms.u_flash.value = flash;

    if (this.flowPoints.visible) {
      this.updateParticles(dt, damage, conflict);
    }
  }

  render() {
    this.renderer.clear();
    this.composer.render();
  }

  onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.camera.aspect = w/h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
    this.composer.setSize(w, h);
    this.uniforms.u_resolution.value.set(w, h);
  }

  get canvas() { return this.renderer.domElement; }
}

// ════════════════════════════════════════════════════════════════
// MUSIC ENGINE
// ════════════════════════════════════════════════════════════════

const CHORD_PROGRESSIONS = {
  pure:     [['C4','E4','G4'],['F4','A4','C5'],['G4','B4','D5'],['A3','C4','E4']],
  uneasy:   [['C4','Eb4','G4'],['F4','Ab4','C5'],['G4','Bb4','D5'],['Ab3','C4','Eb4']],
  dark:     [['C4','Eb4','Gb4'],['Db4','F4','Ab4'],['Eb4','Gb4','Bb4'],['B3','D4','F4']],
  shattered:[['C4','E4','Bb4'],['F#4','A4','D5'],['Eb4','G4','Db5'],['B3','F4','Ab4']]
};
const MELODY_SHAPES = {
  lyrical:[0,2,4,7,4,2,0,-1], ascending:[0,2,3,5,7,8,10,12],
  falling:[12,10,8,7,5,3,2,0], broken:[0,7,3,10,1,8,4,11],
  tentative:[0,2,0,-1,0,4,2,0], anguish:[0,1,0,-1,-2,-1,3,0]
};

function midiToFreq(n){ return 440*Math.pow(2,(n-69)/12); }
function noteToMidi(name){ return Tone.Frequency(name).toMidi(); }

function createMusicEngine(){
  const reverb=new Tone.Reverb({decay:5,wet:0.35}).toDestination();
  const delay=new Tone.FeedbackDelay({delayTime:'8n.',feedback:0.25,wet:0.15}).connect(reverb);
  const filter=new Tone.Filter({frequency:4000,type:'lowpass',rolloff:-12}).connect(delay);
  const distortion=new Tone.Distortion({distortion:0,wet:0}).connect(filter);
  const chorus=new Tone.Chorus({frequency:1.5,delayTime:3.5,depth:0.5,wet:0.2}).connect(distortion);

  const pad=new Tone.PolySynth(Tone.Synth,{maxPolyphony:8,options:{oscillator:{type:'sine'},envelope:{attack:1.5,decay:0.8,sustain:0.6,release:2.5},volume:-20}}).connect(new Tone.Gain(0.6).connect(chorus));
  const v1=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.08,decay:0.3,sustain:0.4,release:0.8},volume:-14}).connect(new Tone.Gain(0.8).connect(chorus));
  const v2=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.12,decay:0.4,sustain:0.35,release:1.0},volume:-14}).connect(new Tone.Gain(0.8).connect(chorus));
  const ghost=new Tone.Synth({oscillator:{type:'fatsawtooth',spread:20},envelope:{attack:0.02,decay:0.15,sustain:0.1,release:0.3},volume:-28}).connect(distortion);
  const noise=new Tone.NoiseSynth({noise:{type:'brown'},envelope:{attack:0.005,decay:0.08,sustain:0,release:0.15},volume:-32}).connect(reverb);
  const bass=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.4,decay:0.6,sustain:0.5,release:1.5},volume:-22}).connect(filter);

  fftAnalyzer = new Tone.FFT(32);
  Tone.getDestination().connect(fftAnalyzer);

  let damage=0, chordIdx=0, timers=[], isOn=false;

  function clearT(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
  function getP(){ return damage<0.15?'pure':damage<0.4?'uneasy':damage<0.7?'dark':'shattered'; }
  function getShape(e){
    if(e.admission) return MELODY_SHAPES.anguish;
    if(e.assault) return MELODY_SHAPES.broken;
    if(e.infidelity) return MELODY_SHAPES.falling;
    if(e.repair) return MELODY_SHAPES.tentative;
    if(e.frank||e.sarah||e.eric) return MELODY_SHAPES.ascending;
    return MELODY_SHAPES.lyrical;
  }

  function playPhrase(entry,density){
    if(!isOn) return;
    clearT();
    const prog=CHORD_PROGRESSIONS[getP()];
    const chord=prog[chordIdx%prog.length]; chordIdx++;
    const root=noteToMidi(chord[0]);
    const shape=getShape(entry);
    const lead=entry.sender==='Role1'?v1:v2;
    const bg=entry.sender==='Role1'?v2:v1;

    pad.releaseAll();
    pad.triggerAttack(chord.map(n=>{
      const cents=damage*(Math.random()-0.5)*30;
      return Tone.Frequency(n).toFrequency()*Math.pow(2,cents/1200);
    }));
    bass.triggerAttackRelease(Tone.Frequency(chord[0]).toFrequency()/2,2.5);

    let time=0;
    const count=Math.min(shape.length,4+Math.floor(Math.random()*5));
    for(let i=0;i<count;i++){
      const note=root+shape[i%shape.length]+(entry.sender==='Role1'?0:7);
      const freq=midiToFreq(note)*Math.pow(2,damage*(Math.random()-0.5)*40/1200);
      const dur=damage>0.7?0.15+Math.random()*0.1:damage>0.4?0.2+Math.random()*0.15:0.3+Math.random()*0.3;
      const gap=Math.max(0.12,0.35-density*0.15+(Math.random()-0.5)*0.1);
      timers.push(setTimeout(()=>{ if(isOn) lead.triggerAttackRelease(freq,dur); },time*1000));
      if(damage>0.3&&Math.random()<damage*0.6){
        const gf=midiToFreq(root+shape[(i+3)%shape.length]+(Math.random()>0.5?12:0))*Math.pow(2,(Math.random()-0.5)*80/1200);
        timers.push(setTimeout(()=>{ if(isOn) ghost.triggerAttackRelease(gf,dur*0.4); },(time+dur*0.3)*1000));
      }
      time+=dur+gap;
    }

    if(entry.repair&&damage>0.1){
      const pure=CHORD_PROGRESSIONS.pure[chordIdx%4];
      timers.push(setTimeout(()=>{ if(isOn) bg.triggerAttackRelease(Tone.Frequency(pure[2]).toFrequency(),0.6); },(time+0.2)*1000));
      timers.push(setTimeout(()=>{ if(isOn) bg.triggerAttackRelease(Tone.Frequency(pure[1]).toFrequency(),0.8); },(time+0.6)*1000));
    }
    if(entry.assault){
      timers.push(setTimeout(()=>{ if(isOn){ noise.triggerAttackRelease('16n'); pad.releaseAll(); } },300));
      timers.push(setTimeout(()=>{ if(isOn) bass.triggerAttackRelease(midiToFreq(root-24),2); },1200));
    }
    if(entry.admission){
      timers.push(setTimeout(()=>{ if(isOn){ pad.releaseAll(); v1.triggerAttackRelease(midiToFreq(root+12),2); } },200));
    }
    timers.push(setTimeout(()=>pad.releaseAll(),(time+0.5)*1000));
  }

  function updateDamage(index){
    let acc=0,heal=0;
    for(let i=0;i<=index;i++){
      const e=emailData[i];
      acc+=e.infidelity*0.08+e.assault*0.12+(e.frank+e.sarah+e.eric)*0.03;
      heal+=e.repair*0.04;
    }
    damage=Math.min(1,Math.max(0,acc-heal));
    currentDamage=damage;
    distortion.distortion=damage*0.6;
    distortion.wet.rampTo(damage*0.5,0.5);
    filter.frequency.rampTo(4000-damage*2800,0.5);
    chorus.wet.rampTo(0.2+damage*0.3,0.3);
    delay.feedback.rampTo(0.15+damage*0.25,0.5);
    v1.oscillator.type=damage>0.5?'sawtooth':damage>0.25?'square':'triangle';
    v2.oscillator.type=damage>0.5?'fatsawtooth':'sine';
    v1.envelope.attack=Math.max(0.01,0.08-damage*0.06);
    v1.envelope.release=Math.max(0.2,0.8-damage*0.5);
  }

  return {
    update(entry,density,index){ updateDamage(index); playPhrase(entry,density); playSpeed=0.00018+density*0.0003+damage*0.0002; },
    start(){ isOn=true; },
    stop(){ isOn=false; clearT(); pad.releaseAll(); v1.triggerRelease(); v2.triggerRelease(); },
    get damage(){ return damage; }
  };
}

// ════════════════════════════════════════════════════════════════
// FFT HELPERS
// ════════════════════════════════════════════════════════════════

function getFFT(){
  if(!fftAnalyzer) return {bass:0,mids:0,highs:0};
  const vals=fftAnalyzer.getValue();
  const norm=v=>Math.max(0,Math.min(1,(v+100)/70));
  let b=0,m=0,h=0;
  for(let i=0;i<4;i++) b+=norm(vals[i]);
  for(let i=4;i<16;i++) m+=norm(vals[i]);
  for(let i=16;i<32;i++) h+=norm(vals[i]);
  return { bass:b/4, mids:m/12, highs:h/16 };
}

function pseudonym(roleId){ return ROLE_IDS.includes(roleId)?currentSet[roleId]:roleId; }

function displayPseudonyms(){
  document.getElementById('set-label').textContent=currentSet.name;
  document.getElementById('pseudonym-list').innerHTML=
    `${currentSet.Role1} / ${currentSet.Role2}<br>${currentSet.Role3} / ${currentSet.Role4} / ${currentSet.Role5}<br><span style="opacity:0.5">${currentSet.Location}</span>`;
}

function loadCSV(){
  return new Promise((resolve,reject)=>{
    Papa.parse('emails_analysis.csv',{
      download:true, header:true, dynamicTyping:true, skipEmptyLines:true,
      complete:(r)=>{
        emailData=r.data.filter(r=>r.Date).map(r=>({
          date:new Date(r.Date), dateStr:r.Date, sender:r.Sender||'',
          infidelity:r.Infidelity_Fallout_Flag||0, assault:r.Mentions_Assault_Related||0,
          frank:r.Mentions_Role3||0, sarah:r.Mentions_Role4||0, eric:r.Mentions_Role5||0,
          repair:r.Repair_Attempt||0, admission:r.Specific_Admission||0, intensity:r.Intensity||0
        }));
        emailData.sort((a,b)=>a.date-b.date);
        resolve();
      }, error:reject
    });
  });
}

function setupTimeline(){
  const markers=document.getElementById('event-markers');
  markers.innerHTML='';
  if(!emailData.length) return;
  const min=emailData[0].date.getTime(), max=emailData[emailData.length-1].date.getTime(), range=max-min||1;
  emailData.forEach((e,i)=>{
    const pct=((e.date.getTime()-min)/range)*100;
    const m=document.createElement('div');
    m.className='event-marker'+(e.infidelity||e.assault?' conflict':e.repair?' repair':e.admission?' admission':' neutral');
    m.style.left=pct+'%';
    m.addEventListener('mouseenter',ev=>showTooltip(ev,e));
    m.addEventListener('mouseleave',hideTooltip);
    markers.appendChild(m);
  });
  const track=document.getElementById('timeline-track');
  let dragging=false;
  track.addEventListener('mousedown',e=>{ dragging=true; scrubTo(e,track); });
  window.addEventListener('mousemove',e=>{ if(dragging) scrubTo(e,track); });
  window.addEventListener('mouseup',()=>{ dragging=false; });
}

function scrubTo(e,track){
  const rect=track.getBoundingClientRect();
  playProgress=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  updateTimelineUI();
}

function showTooltip(ev,entry){
  const tip=document.getElementById('tooltip');
  const flags=[];
  if(entry.infidelity) flags.push('INFIDELITY FALLOUT');
  if(entry.assault) flags.push('ASSAULT RELATED');
  if(entry.frank) flags.push('MENTIONS '+currentSet.Role3.toUpperCase());
  if(entry.sarah) flags.push('MENTIONS '+currentSet.Role4.toUpperCase());
  if(entry.eric) flags.push('MENTIONS '+currentSet.Role5.toUpperCase());
  if(entry.repair) flags.push('REPAIR ATTEMPT');
  if(entry.admission) flags.push('SPECIFIC ADMISSION');
  tip.innerHTML=`<strong>${entry.dateStr}</strong><br>FROM: ${pseudonym(entry.sender)}<br>${flags.length?flags.join(' | '):'BASELINE'}<br>INTENSITY: ${(entry.intensity*100).toFixed(0)}%`;
  tip.style.left=(ev.clientX+15)+'px';
  tip.style.top=(ev.clientY-60)+'px';
  tip.style.display='block';
}
function hideTooltip(){ document.getElementById('tooltip').style.display='none'; }

function updateTimelineUI(){
  document.getElementById('timeline-progress').style.width=(playProgress*100)+'%';
  document.getElementById('timeline-playhead').style.left=(playProgress*100)+'%';
  if(!emailData.length) return;
  const min=emailData[0].date.getTime(), max=emailData[emailData.length-1].date.getTime();
  const d=new Date(min+(max-min)*playProgress);
  document.getElementById('timeline-date').textContent=d.toISOString().split('T')[0]+' | '+currentSet.Location;
}

function getCurrentEntry(){
  if(!emailData.length) return null;
  const min=emailData[0].date.getTime(), max=emailData[emailData.length-1].date.getTime();
  const cur=min+(max-min)*playProgress;
  let closest=0, best=Infinity;
  for(let i=0;i<emailData.length;i++){
    const d=Math.abs(emailData[i].date.getTime()-cur);
    if(d<best){ best=d; closest=i; }
  }
  return { entry:emailData[closest], index:closest };
}

function getLocalDensity(index,w=3){
  let f=0;
  for(let i=Math.max(0,index-w);i<=Math.min(emailData.length-1,index+w);i++){
    const e=emailData[i]; f+=e.infidelity+e.assault+e.frank+e.sarah+e.eric;
  }
  return f/(w*2+1);
}

// ════════════════════════════════════════════════════════════════
// RENDER LOOP
// ════════════════════════════════════════════════════════════════

let visualEngine;
let lastTime = 0;

function render(timestamp){
  requestAnimationFrame(render);
  if(timestamp<freezeFrameUntil) return;

  const dt = Math.min((timestamp-(lastTime||timestamp))/1000, 0.1);
  lastTime = timestamp;
  const timeSec = timestamp/1000;

  if(playing){
    playProgress+=playSpeed;
    if(playProgress>=1){ playProgress=1; playing=false; }
    updateTimelineUI();
  }

  const result=getCurrentEntry();
  if(!result) return;
  const {entry,index}=result;
  const density=getLocalDensity(index);

  if(index!==prevEventIndex){
    prevEventIndex=index;
    document.getElementById('current-sender').textContent=pseudonym(entry.sender);
    if(audioInitialized&&musicEngine) musicEngine.update(entry,density,index);
    if(entry.admission){ flashOpacity=1; freezeFrameUntil=timestamp+800; }
    if(entry.infidelity||entry.assault){ shakeAmount=8+entry.intensity*12; desaturation=0.6; }
  }

  shakeAmount*=0.92;
  desaturation*=0.95;
  flashOpacity*=0.85;

  const fft=getFFT();
  const conflict=(entry.infidelity||entry.assault)?Math.max(entry.intensity,0.5):0;
  const repair=entry.repair?1:0;

  visualEngine.applyMode(VISUAL_MODES[visualModeIndex]);
  visualEngine.update(timeSec, dt, currentDamage, conflict, repair, fft.bass, fft.mids, fft.highs, shakeAmount, flashOpacity);
  visualEngine.render();

  document.getElementById('flash-overlay').style.opacity=flashOpacity;
  document.getElementById('play-state').textContent=playing?'PLAYING':'PAUSED';
}

// ════════════════════════════════════════════════════════════════
// INTERACTION
// ════════════════════════════════════════════════════════════════

function setupInteraction(){
  document.addEventListener('click',e=>{
    if(e.target.closest('#timeline-container')||e.target.closest('button')) return;
    if(!audioStarted){ initAudio(); audioStarted=true; }
    playing=!playing;
    if(musicEngine){ playing?musicEngine.start():musicEngine.stop(); }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='r'||e.key==='R'){
      const ci=PSEUDONYM_SETS.indexOf(currentSet);
      currentSet=PSEUDONYM_SETS[(ci+1)%PSEUDONYM_SETS.length];
      displayPseudonyms(); prevEventIndex=-1;
    }
    if(e.key==='s'||e.key==='S'){
      visualModeIndex=(visualModeIndex+1)%VISUAL_MODES.length;
      document.getElementById('mode-display').textContent=VISUAL_MODES[visualModeIndex].name;
    }
    if(e.key===' '){
      e.preventDefault();
      if(!audioStarted){ initAudio(); audioStarted=true; }
      playing=!playing;
      if(musicEngine){ playing?musicEngine.start():musicEngine.stop(); }
    }
  });

  document.getElementById('screenshot-btn').addEventListener('click',()=>{
    visualEngine.render();
    const link=document.createElement('a');
    link.download=`digital_ghosts_${Date.now()}.png`;
    link.href=visualEngine.canvas.toDataURL('image/png');
    link.click();
  });

  let mediaRecorder=null, recordedChunks=[];
  document.getElementById('record-btn').addEventListener('click',async()=>{
    const btn=document.getElementById('record-btn');
    if(mediaRecorder&&mediaRecorder.state==='recording'){
      mediaRecorder.stop(); btn.classList.remove('recording'); btn.textContent='REC'; return;
    }
    try{
      const stream=visualEngine.canvas.captureStream(30);
      recordedChunks=[];
      mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
      mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop=()=>{
        const blob=new Blob(recordedChunks,{type:'video/webm'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download=`digital_ghosts_${Date.now()}.webm`; a.click();
      };
      mediaRecorder.start(); btn.classList.add('recording'); btn.textContent='STOP';
      setTimeout(()=>{ if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); btn.classList.remove('recording'); btn.textContent='REC'; } },60000);
    }catch(err){ console.error('Recording failed:',err); }
  });
}

async function initAudio(){
  if(audioInitialized) return;
  await Tone.start();
  Tone.Transport.bpm.value=90;
  musicEngine=createMusicEngine();
  musicEngine.start();
  audioInitialized=true;
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════

async function init(){
  displayPseudonyms();
  document.getElementById('mode-display').textContent=VISUAL_MODES[visualModeIndex].name;

  try{ await loadCSV(); }
  catch(err){
    console.error('CSV load failed:',err);
    document.getElementById('loading-text').textContent='CSV NOT FOUND';
    document.getElementById('loading-text').style.color='#ff0040';
    return;
  }

  visualEngine = new VisualEngine(document.getElementById('main-canvas'));
  visualEngine.applyMode(VISUAL_MODES[visualModeIndex]);

  setupTimeline();
  updateTimelineUI();
  setupInteraction();

  setTimeout(()=>{
    document.getElementById('loading-screen').classList.add('fade-out');
    setTimeout(()=>document.getElementById('loading-screen').style.display='none',800);
    requestAnimationFrame(render);
  },2000);
}

init();
</script>
